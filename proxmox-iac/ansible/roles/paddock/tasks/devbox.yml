---
# Dev-box only: the software-engineering tooling keepers use to build and drive
# real apps. The lean home box skips all of this.

- name: Install PM2 (preview-server process manager)
  community.general.npm:
    name: pm2
    global: true
    state: present

# The `pm` convention (stable-port preview servers) is a thin wrapper over PM2.
# It ships in the official devbox image; on a bare box supply your own wrapper
# or drive PM2 directly. We install the PM2 foundation here.

- name: Install ffmpeg and headless-browser packages
  ansible.builtin.apt:
    name:
      - ffmpeg
      - chromium            # headless browser for the Playwright MCP
      - fonts-liberation
    state: present
    update_cache: true
    cache_valid_time: 3600

# The Playwright MCP itself is run on demand via `npx @playwright/mcp`; it drives
# the system chromium above. Nothing to install globally here.

# --- Docker Engine (docker-in-LXC; needs nesting=1,keyctl=1 from Tofu) ------
- name: Add Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: paddock_install_docker | bool

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: paddock_install_docker | bool

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: paddock_install_docker | bool

- name: Allow the paddock user to use Docker
  ansible.builtin.user:
    name: "{{ paddock_user }}"
    groups: docker
    append: true
  when: paddock_install_docker | bool
