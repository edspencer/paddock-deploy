---
# PRIMARY deploy path: extract the release tarball and run it with the host's
# Node under a systemd unit. Keeper agents use the host-installed claude/gh
# (and, on the dev box, pm2/ffmpeg/browser/docker).

- name: Fetch Paddock release tarball
  ansible.builtin.get_url:
    url: "{{ paddock_release_url }}"
    dest: /tmp/paddock-release.tar.gz
    mode: "0644"
  when: paddock_release_url | length > 0

- name: Extract Paddock release
  ansible.builtin.unarchive:
    src: /tmp/paddock-release.tar.gz
    dest: "{{ paddock_home }}"
    remote_src: true
    owner: "{{ paddock_user }}"
    group: "{{ paddock_group }}"
    extra_opts: ["--strip-components=1"]
  notify: Restart paddock

# The release ships source + a lockfile but no node_modules, so install the
# production dependencies in place (per the release's INSTALL.md). Run as root
# (the paddock service user is nologin, and the box has no sudo), then hand the
# tree back to the service user below.
- name: Install Paddock production dependencies (npm ci)
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ paddock_home }}"
  environment:
    HOME: "{{ paddock_home }}"
  changed_when: true
  when: paddock_release_url | length > 0

- name: Ensure the app tree is owned by the service user
  ansible.builtin.file:
    path: "{{ paddock_home }}"
    owner: "{{ paddock_user }}"
    group: "{{ paddock_group }}"
    recurse: true
  when: paddock_release_url | length > 0

- name: Install the systemd unit (tarball)
  ansible.builtin.template:
    src: paddock.service.j2
    dest: /etc/systemd/system/paddock.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart paddock

- name: Enable and start Paddock
  ansible.builtin.systemd_service:
    name: paddock
    enabled: true
    state: started
    daemon_reload: true
  when: paddock_manage_service | bool
