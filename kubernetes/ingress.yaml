# OPTIONAL Ingress for Paddock.
#
# Paddock has NO built-in authentication. This Ingress is only safe once an auth
# layer sits in front of it — an external auth proxy (oauth2-proxy, Authelia,
# Authentik, Cloudflare Access) or your ingress controller's auth middleware.
# The commented annotations below show the nginx external-auth pattern; adapt to
# your controller. Without one of these, anyone who can reach the host has full
# control of your keepers.
#
# NOTE — Paddock's Management API: if you enable auth annotations here AND you
# run the remote MCP endpoint at /mcp, that auth layer will BREAK MCP. An SSO
# proxy answers with a 302 to an HTML login page (which no MCP client can
# follow), and Basic Auth collides head-on with the client's
# `Authorization: Bearer` header. Pair this file with `ingress-mcp.yaml`, which
# routes /mcp and /.well-known/oauth-protected-resource un-gated — Paddock
# authenticates those itself, independently of any ingress. Read the
# deploy-ordering warning in that file before applying it.
#
# Edit the host, TLS secret, and ingressClassName for your cluster before use.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paddock
  labels:
    app.kubernetes.io/name: paddock
  annotations:
    # --- Example: delegate auth to an oauth2-proxy (ingress-nginx) ---
    # nginx.ingress.kubernetes.io/auth-url: "https://auth.example.com/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://auth.example.com/oauth2/start?rd=$escaped_request_uri"
    # Paddock uses WebSockets for live chat; most controllers proxy them on the
    # same route with no extra config. Raise proxy read/send timeouts if your
    # controller closes idle upgrades early.
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - paddock.example.com
      secretName: paddock-tls
  rules:
    - host: paddock.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paddock
                port:
                  name: http
