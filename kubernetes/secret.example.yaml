# Example Secret for Paddock — DO NOT COMMIT REAL TOKENS.
#
# Copy this file to secret.yaml, fill in your real values, and apply it (or add
# it to kustomization.yaml). secret.yaml is gitignored.
#
#   cp secret.example.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl -n <namespace> apply -f secret.yaml
#
# Prefer generating it imperatively so tokens never touch a file at all:
#
#   kubectl -n <namespace> create secret generic paddock-secrets \
#     --from-literal=CLAUDE_CODE_OAUTH_TOKEN='sk-...' \
#     --from-literal=GITHUB_TOKEN='ghp_...'
#
# These keys are injected into the container via `envFrom` (see deployment.yaml):
#   CLAUDE_CODE_OAUTH_TOKEN  Claude Max auth for keepers (runtime: cli).
#                            Use ANTHROPIC_API_KEY instead for the SDK runtime.
#   GITHUB_TOKEN (optional)  Enables git push to backing repos.
apiVersion: v1
kind: Secret
metadata:
  name: paddock-secrets
  labels:
    app.kubernetes.io/name: paddock
type: Opaque
stringData:
  # Provide CLAUDE_CODE_OAUTH_TOKEN *or* ANTHROPIC_API_KEY.
  CLAUDE_CODE_OAUTH_TOKEN: "replace-me"
  # ANTHROPIC_API_KEY: "replace-me"
  # Optional — omit if your keepers don't push to GitHub.
  GITHUB_TOKEN: "replace-me"
