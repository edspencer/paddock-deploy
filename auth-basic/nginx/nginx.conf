# nginx Basic-Auth sidecar for Paddock.
#
# Terminates TLS, enforces HTTP Basic Auth, and proxies authenticated requests
# to Paddock over the private Compose network, injecting the authenticated user
# as X-Forwarded-User.

events {}

http {
	# Map for WebSocket upgrades — Paddock's live chat streams over WS.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Redirect all plain HTTP to HTTPS. Basic Auth is only safe over TLS.
	server {
		listen 80;
		server_name _;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name _;

		ssl_certificate     /etc/nginx/certs/paddock.crt;
		ssl_certificate_key /etc/nginx/certs/paddock.key;

		auth_basic           "Paddock";
		auth_basic_user_file /etc/nginx/htpasswd;

		# Allow large uploads (attachments / voice notes).
		client_max_body_size 100m;

		# The identity this proxy asserts to Paddock. Defaults to the Basic Auth
		# user; the exempt /mcp locations below reset it to "" (nginx omits a
		# header whose value is the empty string) because no Basic Auth ran
		# there, so there is no identity to assert.
		#
		# It has to be routed through this variable rather than referencing
		# `$remote_user` directly: `$remote_user` is computed LAZILY by parsing
		# the `Authorization` header, NOT by the auth_basic module, so under
		# `auth_basic off` it still resolves — to whatever unverified username
		# the client put there. Verified: with the header set directly,
		# `curl -u evil:whatever https://…/mcp` reached the upstream as
		# `X-Forwarded-User: evil`. On this path only auth_basic's ACCESS-phase
		# check makes the value trustworthy, so where that check is off, the
		# value must be dropped.
		set $forwarded_user $remote_user;

		# ── Shared proxy settings, declared ONCE at server level ──────────────
		# Every `location` below inherits these. Keep them here and do NOT add a
		# `proxy_set_header` inside a location: nginx REPLACES an inherited
		# directive set wholesale rather than merging it, so a single
		# `proxy_set_header` in one location would silently drop every header
		# declared here — for that location only. One copy is what keeps the
		# challenged and exempt paths from drifting apart; the per-path
		# difference is carried by `$forwarded_user` above instead.
		#
		# X-Forwarded-User is overwritten (never trusted) from the authenticated
		# Basic Auth user. Because this REPLACES any client-supplied value, the
		# header cannot be forged.
		proxy_set_header X-Forwarded-User  $forwarded_user;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket upgrade for live chat streaming.
		proxy_http_version 1.1;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;

		# ── Paddock's Management API (/mcp) — EXEMPT from Basic Auth ──────────
		# Basic Auth and MCP collide head-on: this proxy challenges with the
		# `Authorization` header, and an MCP client puts its own
		# `Authorization: Bearer <token>` there. nginx reads that bearer token as
		# malformed Basic credentials and 401s, so an MCP client can NEVER reach
		# Paddock through a blanket `auth_basic`. Hence `auth_basic off` here.
		#
		# These paths are still authenticated — by PADDOCK, not by this proxy.
		# `/mcp` runs its own per-client token authenticator, independent of
		# PADDOCK_AUTH_MODE and of this sidecar, and it fails CLOSED: 404 when no
		# management clients are configured, 401 + `WWW-Authenticate` when the
		# credential is missing or wrong. A proxy is never what gates it.
		#
		#   !! DEPLOY ORDER !! Only apply this exemption once you are running a
		#   Paddock that authenticates /mcp (v0.46.0 or newer). On an older build
		#   /mcp is not gated by anything, so exempting it here would publish an
		#   unauthenticated, TURN-SPAWNING endpoint — and a keeper has a shell, so
		#   any write scope on it is remote code execution on this host. Upgrade
		#   Paddock first, confirm /mcp 404s or 401s on its own, then exempt.
		#
		# `= /mcp` and `^~ /mcp/` rather than a bare `location /mcp`: a plain
		# prefix match would also exempt `/mcpanything`, widening the hole beyond
		# the one route that needs it.
		location = /mcp {
			auth_basic off;
			set $forwarded_user "";
			proxy_pass http://paddock:4000;
		}

		location ^~ /mcp/ {
			auth_basic off;
			set $forwarded_user "";
			proxy_pass http://paddock:4000;
		}

		# RFC 9728 protected-resource discovery metadata, fetched BEFORE the
		# client holds any credential — gating it makes discovery impossible. `^~`
		# covers the path-inserted form
		# `/.well-known/oauth-protected-resource/mcp`, which is the URL clients
		# actually request. A client that gets HTML or a Basic challenge here
		# silently falls through to treating Paddock as its own authorization
		# server, with no error naming the cause.
		location ^~ /.well-known/oauth-protected-resource {
			auth_basic off;
			set $forwarded_user "";
			proxy_pass http://paddock:4000;
		}

		# ── Everything else: the browser UI, gated by Basic Auth ──────────────
		location / {
			proxy_pass http://paddock:4000;
		}
	}
}
