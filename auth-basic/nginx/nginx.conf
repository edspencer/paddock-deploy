# nginx Basic-Auth sidecar for Paddock.
#
# Terminates TLS, enforces HTTP Basic Auth, and proxies authenticated requests
# to Paddock over the private Compose network, injecting the authenticated user
# as X-Forwarded-User.

events {}

http {
	# Map for WebSocket upgrades — Paddock's live chat streams over WS.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Redirect all plain HTTP to HTTPS. Basic Auth is only safe over TLS.
	server {
		listen 80;
		server_name _;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name _;

		ssl_certificate     /etc/nginx/certs/paddock.crt;
		ssl_certificate_key /etc/nginx/certs/paddock.key;

		auth_basic           "Paddock";
		auth_basic_user_file /etc/nginx/htpasswd;

		# Allow large uploads (attachments / voice notes).
		client_max_body_size 100m;

		location / {
			# Overwrite (never trust) the identity header, setting it from the
			# authenticated Basic Auth user ($remote_user). Because this
			# proxy_set_header REPLACES any client-supplied X-Forwarded-User,
			# the header cannot be forged by the client.
			proxy_set_header X-Forwarded-User $remote_user;

			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_pass http://paddock:4000;

			# WebSocket upgrade for live chat streaming.
			proxy_http_version 1.1;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 3600s;
		}
	}
}
